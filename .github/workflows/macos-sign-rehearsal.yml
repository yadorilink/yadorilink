name: macOS signing rehearsal

# Proves the macOS code-signing and notarization chain with a tiny sample program before a
# release is tagged: the same script the release workflow uses signs it with the Developer ID
# Application certificate and notarytool must accept it. Run it by hand from the Actions tab
# on main (or a release tag); the release-signing environment decides who may approve it and
# which refs may run it. It publishes nothing: no release, no attestation, no id-token.
on:
  workflow_dispatch:

concurrency:
  group: macos-sign-rehearsal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sample:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Build the sample program
        shell: bash
        run: |
          set -euo pipefail
          mkdir sample
          printf 'int main(void) { return 0; }\n' > sample/rehearsal.c
          cc -arch arm64 -mmacosx-version-min=14.0 -o sample/yadorilink-rehearsal sample/rehearsal.c

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-sample
          path: sample/yadorilink-rehearsal
          if-no-files-found: error

  sign-sample:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-sample
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the sample
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-sample
          path: sample

      - name: Sign and notarize
        shell: bash
        env:
          MACOS_DEVELOPER_ID_APP_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APP_P12_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          chmod +x sample/yadorilink-rehearsal
          bash .github/release/macos-sign-notarize.sh sample/yadorilink-rehearsal=com.juntaki.yadorilink.engine.rehearsal

      # A bare executable cannot carry a stapled ticket, so there is no stapler check; the notary
      # service's Accepted answer above is the notarization proof. Gatekeeper's verdict on a bare
      # tool is printed, and only an explicit "Unnotarized" verdict fails the rehearsal.
      - name: Verify the result
        shell: bash
        run: |
          set -euo pipefail
          f=sample/yadorilink-rehearsal
          codesign --verify --strict --verbose=2 "$f"
          codesign -d --verbose=4 "$f" 2>&1 | grep -E '^(Identifier|Authority|Timestamp|TeamIdentifier|CodeDirectory)'
          if verdict="$(spctl --assess --type execute --verbose=4 "$f" 2>&1)"; then
            echo "$verdict"
          else
            echo "$verdict"
            if grep -q 'Unnotarized' <<<"$verdict"; then
              echo "error: Gatekeeper reports the sample as not notarized" >&2
              exit 1
            fi
            echo "note: Gatekeeper does not assess bare command-line tools like an app; the signature and the notarization result above are the proof"
          fi
