name: Lint

# Formatting-independent static checks that must hold on every OS the product
# ships on: Clippy with warnings denied. Verify and Release both call this
# workflow, so the two cannot drift apart (a Windows-only warning once passed
# Verify and stopped three release tags).

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy-${{ matrix.os }}
          components: rustfmt, clippy
          token: ${{ github.token }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The Windows shell extension is its own workspace, so the step above
      # does not reach it.
      - name: Shell extension
        if: always() && runner.os == 'Windows'
        working-directory: crates/yadorilink-shell-ext-windows
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
