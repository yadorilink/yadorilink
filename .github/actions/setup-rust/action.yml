name: Set up Rust
description: Toolchain, protoc and cargo cache shared by the CI workflows.
inputs:
  cache-key:
    description: rust-cache key
    required: true
  components:
    description: Extra rustup components
    default: ""
  protoc:
    description: Install protoc
    default: "true"
  token:
    description: Token for the protoc download
    required: true
runs:
  using: composite
  steps:
    - if: inputs.protoc == 'true'
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: protoc@3.26.1  # install-action numbers protoc as 3.<release>: protobuf v26.1
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-06-30
      with:
        toolchain: stable
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
