[package]
name = "yadorilink-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Not a member of the main workspace: nothing here changes the normal build. Run with
# `cargo +nightly fuzz run <target>` from this directory (see fuzz/README.md).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
yadorilink-replica-domain = { path = "../crates/yadorilink-replica-domain" }
yadorilink-peer-session = { path = "../crates/yadorilink-peer-session" }
yadorilink-sync-wire = { path = "../crates/yadorilink-sync-wire" }
yadorilink-sync-protocol = { path = "../crates/yadorilink-sync-protocol" }
yadorilink-fs-platform = { path = "../crates/yadorilink-fs-platform" }
yadorilink-daemon = { path = "../crates/yadorilink-daemon" }

[profile.release]
debug = 1

[[bin]]
name = "protocol5_message"
path = "fuzz_targets/protocol5_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol5_proof"
path = "fuzz_targets/protocol5_proof.rs"
test = false
doc = false
bench = false

