[[call_site]]
name = "each_database_file_is_opened_once"
paths = ["crates/**/*.rs"]
patterns = ['SyncDatabase::open\s*\(']
allowed_paths = [
  "crates/yadorilink-daemon/src/replica_coordinator.rs",
  "crates/yadorilink-send/src/store.rs",
  "crates/yadorilink-local-storage/src/segment_store/index.rs",
]
skip_test_paths = true
test_spans = "exclude"
reason = """
The connection pool and the in-process writer gate a `SyncDatabase` owns
serialize writers within one process against one file, so a second open of
the SAME file is a second gate and no serialization at all. Three database
files exist and each has exactly one production opener: the replica database
opened by `ReplicaCoordinator::open`, the separate single-file send database
opened by `SendStore::open`, and the block store's own persistent index
opened by `BlockIndex::open`. A further caller opening any of them is the
bypass this rule catches. `open_in_memory` is a different constructor and
deliberately not matched -- an in-memory database is per-handle by
construction.

The block index is a separate file on purpose, not a table in the replica
database: it is the block store's own metadata, its writes are the store's
durability path rather than the replica's, and keeping it separate means a
group commit's index transaction does not contend with the replica's writer
gate for a lock it has no reason to want.
"""

[[forbidden_symbol]]
name = "background_custody_never_takes_a_strong_proof"
paths = ["crates/yadorilink-daemon/src/background_custody.rs"]
symbols = [
  "full_replica_handoff_proof",
  "full_replica_handoff_ready",
  "another_full_replica_is_ready",
  "peer_holds_entire_group",
  "request_version_present",
  "StrongHandoffProof",
  "confirm_version_present_via_peer",
]
reason = """
The background custody monitor refreshes a health indicator every ninety
seconds. It used to do that by running the action-time handoff proof, which
issues one round-trip per durability root and makes the peer read that
version's blocks back off disk and re-hash every one. Eight thousand roots
meant eight thousand whole-file re-reads a sweep, to decide what a status
listing printed.

The cycle body lives in one file so this rule has something to point at: no
strong-proof entry point may be named there, including the `DaemonState`
wrappers, so the cheap path cannot quietly acquire an expensive fallback for
the case where no peer answers. That case is exactly when a fallback is most
tempting and most expensive.

This is a text rule, not a call-graph one. It catches these names, not an
arbitrary indirection built to reach them. Two other things carry the same
invariant: `StrongHandoffProof` has private fields and one constructor, so it
cannot be forged or cached; and the scale tests assert that a cycle finding
nothing issues zero per-root requests, which is the behaviour rather than the
spelling.
"""

[[call_site]]
name = "the_force_latch_is_cleared_only_by_a_strong_proof"
paths = ["crates/**/*.rs"]
patterns = ['clear_group_durability_latch\s*\(']
allowed_paths = [
  "crates/yadorilink-daemon/src/daemon_state.rs",
]
skip_test_paths = true
test_spans = "exclude"
reason = """
A `--force` unlink that bypassed the durability gate pins its group to
`Unknown` in a persisted latch table. The latch means: this device
deliberately overrode its own proof, and must not claim protection again
until a real proof says otherwise.

Only `full_replica_handoff_ready`'s success path may retire it -- the gate
re-earning its own answer. The background custody monitor deliberately does
not, and could not honestly: its evidence is an index comparison between two
peers, which is not the kind of fact the latch was set to wait for. Before
the two were separated, the background sweep ran the proof and so cleared the
latch as a side effect, which was correct only by accident of implementation.
"""

[[call_site]]
