# YadoriLink architecture manifest.
#
# This file is the single declarative statement of the workspace's intended
# structure. `.github/checks/check-architecture.py` reads it, resolves the real
# crate graph with `cargo metadata`, scans the sources named by each rule,
# and fails CI on any divergence. There is one checker and one manifest: a
# new boundary is a new entry here, never a new bespoke script.
#
# ## Model
#
# Crates are stratified into ordered layers. A crate may depend on crates in
# its own layer or in any LOWER layer, never a higher one. Layer membership
# is exhaustive: every workspace member must appear in exactly one layer, so
# a newly added crate cannot silently sit outside the model.
#
# Layer order alone is coarse (it permits every edge inside a layer), so the
# crates whose isolation actually carries weight additionally declare an
# exact `workspace_dependencies` allowlist, and rules below forbid specific
# third-party packages and source symbols per crate or per path.
#
# ## Rule kinds
#
# * `[layer.<name>]`            layer membership (order fixed by `layers.order`)
# * `[crate."<name>"]`          exact allowed workspace dependencies
# * `[[forbidden_dependency]]`  packages a crate must not name, by kind
# * `[[forbidden_symbol]]`      substrings that must not appear in given sources
# * `[[forbidden_pattern]]`     the same, as a regex, with optional line guards
# * `[[confined_symbol]]`       symbols allowed only in named files of a scope
# * `[[call_site]]`             a call allowed only from named files
#
# ## Scanning conventions, applied uniformly by the checker
#
# * Whole-line comments (`//`, `///`, `//!`) are never scanned. Only real
#   code can violate a source rule; prose that names a forbidden path is a
#   documentation choice, not a dependency.
# * `test_spans = "exclude"` additionally drops `#[cfg(test)]` items, for the
#   rules whose invariant is about the production graph rather than about
#   what a unit-test fixture may construct in-process. The exempted region is
#   the attributed item's own brace-matched span, so production code that
#   merely sits after a test module in the same file is still scanned.
# * Every path pattern -- each entry of a `paths` or `allowed_paths` list,
#   individually, not the list as a whole -- must match at least one real
#   file, and every crate named here must exist in the workspace. A rule that
#   lists three files and still resolves two of them has stopped guarding the
#   third, so that is a failure, not a silent pass: a guard that quietly stops
#   guarding is the failure mode this manifest exists to prevent.
#
# These are checks on structure, not on behavior: they are substring and
# regex matches over sources plus the resolved Cargo graph, not a Rust
# parser. A deliberate `use tokio as t;` rename evades a symbol rule.
# Reviewer judgment remains the backstop, as it does for every lint.

[layers]
# Bottom to top. Index in this list is the layer's rank.
order = [
  "contract",
  "domain",
  "platform",
  "storage",
  "engine",
  "application",
  "client",
  "interface",
]


[layer.contract]
purpose = """
Serialization contracts. Generated protobuf types, with no policy, no I/O,
and no workspace dependencies.
"""
crates = [
  "yadorilink-ipc-proto",
]

[layer.domain]
purpose = """
Pure, synchronous model and policy. Identities, file and version records,
the signed canonical change, the deterministic replica
policy engine, and the range-based set reconciliation algorithm. Nothing
beneath these but the standard library and
cryptography: no async runtime, no database, no wire framing, no filesystem
or network access.
"""
crates = [
  "yadorilink-replica-domain",
  "yadorilink-replica-engine",
  "yadorilink-namespace",
  "yadorilink-dcf-oracle",
]

[layer.platform]
purpose = """
Process-level infrastructure that knows nothing about replica policy: the
shared SQLite connection pool and writer gate, the device signing key and
its OS keyring storage and the macOS keychain items beneath it, the iroh
networking substrate that
IS the peer transport, the peer wire codec, the HTTP request/response
surface, the OAuth (FAPI 2.0) credential client, the reporting crate
(report shapes, the local consent and candidate files, the HTTPS submission
client), the generic filesystem layer (durable namespace changes, capability
probes, file identity, the reserved artefact namespace) and the root-authority
capability (root lease, commit permit, sync-root lock and identity) built on
it. Each of these owns
one mechanism and must stay ignorant of the domain concepts layered above
it.
"""
crates = [
  "yadorilink-sqlite-runtime",
  "yadorilink-transport",
  "yadorilink-sync-wire",
  "yadorilink-http-api",
  "yadorilink-sync-substrate",
  "yadorilink-fapi-client",
  "yadorilink-reporting",
  "yadorilink-fs-platform",
  "yadorilink-root-authority",
  "yadorilink-os-keychain",
  "yadorilink-windows-provider-policy",
]

[layer.storage]
purpose = """
Content-addressed local block and file storage, expressed against the domain
model.
"""
crates = [
  "yadorilink-local-storage",
]

[layer.engine]
purpose = """
The synchronization engines: the peer session that speaks the wire protocol,
the single-file send path, filesystem materialization, the SQLite
persistence adapter, local change capture, the reconciliation protocol and
the runtime that drives it over the substrate, and the lane adapters that
present substrate lanes through the peer session's ports. These compose the layers
below into running behavior but own no process lifecycle of their own.
"""
crates = [
  "yadorilink-peer-session",
  "yadorilink-send",
  "yadorilink-filesystem-sync",
  "yadorilink-sync-sqlite",
  "yadorilink-local-capture",
  "yadorilink-sync-protocol",
  "yadorilink-sync-runtime",
  "yadorilink-lane-ports",
]

[layer.application]
purpose = """
The daemon: process lifecycle, the composition root, and the application
services the interfaces drive.
"""
crates = [
  "yadorilink-daemon",
]

[layer.client]
purpose = """
The client application layer every user-facing front end shares: the one
control-socket client for the local daemon, the coordination-plane client, the
typed operations the front ends drive, and the product-facing view models
derived from them. Returns typed results; never prints, prompts or exits.
"""
# yadorilink-product-view sits here rather than with the interfaces because
# the client layer derives from it; a lower layer may not depend on a higher
# one. It is pure view derivation over the IPC contract and over values its
# caller fetches (its exact allowlist below holds that).
crates = [
  "yadorilink-client-core",
  "yadorilink-product-view",
  # The embedded host composes the engine (the application layer) with the client layer's
  # sign-in, registration and account operations over the engine's own state directory, so it
  # sits with the client layer: a lower layer may not depend on a higher one.
  "yadorilink-embedded-host",
]

[layer.interface]
purpose = """
User-facing entry points: they parse input, call the client layer and render
its results.
"""
crates = [
  "yadorilink-client-ffi",
  "yadorilink-mobile-ffi",
  "yadorilink-cli",
]


# ---------------------------------------------------------------------------
# Exact workspace-dependency allowlists.
#
# For the crates whose isolation is load-bearing, the layer rank is not
# specific enough: it would permit any edge within a layer. These crates
# declare their full set of workspace dependencies instead, so widening one
# is a deliberate, reviewable edit here rather than an unnoticed line in a
# manifest. Only normal (non-dev, non-build) dependencies count -- a test
# fixture reaching for a higher layer is not a production cycle, and several
# of these crates deliberately use such a dev-only back edge.
#
# That normal-only scope is why an empty list here does NOT by itself mean
# "no workspace dependency of any kind". For the crates that must hold to
# zero of any kind -- the domain model, the policy engine, the wire codec --
# the forbidden-workspace-crate half of that invariant is stated in their
# `forbidden_dependency` rules below, whose `kinds` covers dev and build too.
# ---------------------------------------------------------------------------

[crate."yadorilink-replica-domain"]
reason = "The domain model sits at the bottom; it depends on no workspace crate."
workspace_dependencies = []

[crate."yadorilink-root-authority"]
reason = """
Root identity, leases, commit permits and the sync-root lock, expressed over
the domain model and the generic filesystem layer.
"""
workspace_dependencies = ["yadorilink-fs-platform", "yadorilink-replica-domain"]

[crate."yadorilink-os-keychain"]
reason = """
The macOS keychain items (credential store and device-key mirror) behind a
small platform-independent interface. It must depend on no other workspace
crate: the credential client and the transport both use it and do not depend
on each other.
"""
workspace_dependencies = []

[crate."yadorilink-fs-platform"]
reason = """
The generic filesystem layer. It must not depend on root authority, the
SQLite adapter or any engine: leases and permits are built on it, never the
reverse.
"""
workspace_dependencies = ["yadorilink-replica-domain"]

[crate."yadorilink-windows-provider-policy"]
reason = """
The Windows provider host's policy (retire-or-retry verdicts, local-change
derivation, subtree retention, Stage recovery, the provider protocol client,
windowed exact-version fetch), kept free of Win32 so it builds and tests on
every platform. It speaks the shell-IPC contract and uses the generic
filesystem layer; it reaches no engine, no storage and no root authority.
"""
workspace_dependencies = ["yadorilink-fs-platform", "yadorilink-ipc-proto"]

[crate."yadorilink-replica-engine"]
reason = """
Change admission, causal authorization, custody and durability evidence, and
deterministic conflict repair election. Pure policy over the domain model,
so it can be reasoned about and tested without a runtime.
"""
workspace_dependencies = ["yadorilink-replica-domain"]

[crate."yadorilink-namespace"]
reason = """
The authenticated namespace trie and its node digests. Pure over a caller's
node store; it reads only the identity types of the domain model.
"""
workspace_dependencies = ["yadorilink-replica-domain"]

[crate."yadorilink-dcf-oracle"]
reason = """
Research asset: a reference oracle the native causal state's differential
tests compare against. It depends on no workspace crate, so it cannot share
a bug with the code it checks. Test-only: no production crate depends on it.
"""
workspace_dependencies = []

[crate."yadorilink-sqlite-runtime"]
reason = """
Owns exactly the connection pool, the in-process writer gate, connection
PRAGMA setup, and the transaction helpers for the shared database file. It
must know nothing about domain concepts, replica policy, or wire framing. Its
one workspace dependency is the generic filesystem layer's durable-publish
primitive, used to write the creation marker durably.
"""
workspace_dependencies = ["yadorilink-fs-platform"]

[crate."yadorilink-sync-wire"]
reason = """
The standalone peer wire codec and frame layer. It depends on the generated
protobuf contract and nothing else; a dependency on the domain model or on
any engine crate would recreate the cycle this split exists to cut.
"""
workspace_dependencies = ["yadorilink-ipc-proto"]

[crate."yadorilink-sync-substrate"]
reason = """
The only crate that names iroh types. Everything above it speaks in peer
ids, lanes, and links, so a substrate upgrade is absorbed here; a workspace
dependency would put domain knowledge beneath the carrier.
"""
workspace_dependencies = []

[crate."yadorilink-sync-protocol"]
reason = """
Reconciliation and bundle transfer over the reconciliation algorithm only. It
knows neither the substrate that carries its bytes nor the replica it
reconciles.
"""
workspace_dependencies = []

[crate."yadorilink-sync-runtime"]
reason = """
Where the substrate and the protocol meet: it owns the endpoint, dials peers and
routes inbound lane streams. It composes exactly those two.
"""
workspace_dependencies = [
  "yadorilink-sync-protocol",
  "yadorilink-sync-substrate",
]

[crate."yadorilink-lane-ports"]
reason = """
Adapters that present substrate lanes through the peer session's ports, and
nothing else: no policy, no persistence, no daemon.
"""
workspace_dependencies = [
  "yadorilink-peer-session",
  "yadorilink-sync-protocol",
  "yadorilink-sync-runtime",
  "yadorilink-sync-substrate",
  "yadorilink-transport",
]

[crate."yadorilink-peer-session"]
reason = """
Owns the peer session and its supporting modules. It reaches persistence
only through its own port traits, so it must not depend on the SQLite
adapter or on any crate above it; its wire encoding comes exclusively from
the wire codec crate.
"""
workspace_dependencies = [
  "yadorilink-fs-platform",
  "yadorilink-local-storage",
  "yadorilink-replica-domain",
  "yadorilink-replica-engine",
  "yadorilink-root-authority",
  "yadorilink-sync-wire",
  "yadorilink-transport",
]

[crate."yadorilink-sync-sqlite"]
reason = """
The single adapter owning YadoriLink-specific SQLite persistence. It must
not reach back into the peer session, the daemon, the transport, or the wire
codec: persistence is driven by those, never the reverse.
"""
workspace_dependencies = [
  "yadorilink-fs-platform",
  "yadorilink-local-storage",
  "yadorilink-namespace",
  "yadorilink-replica-domain",
  "yadorilink-replica-engine",
  "yadorilink-root-authority",
  "yadorilink-sqlite-runtime",
]

[crate."yadorilink-local-capture"]
reason = """
Owns local change processing and the mutation-store port it consumes. All
persistence goes through that port, and filesystem events arrive as
already-built value types -- it runs no watcher and no SQL of its own.
"""
workspace_dependencies = [
  "yadorilink-filesystem-sync",
  "yadorilink-fs-platform",
  "yadorilink-local-storage",
  "yadorilink-replica-domain",
  "yadorilink-root-authority",
  "yadorilink-sync-sqlite",
]

[crate."yadorilink-client-core"]
reason = """
The one client application layer shared by every front end. It reaches the
daemon only through the control-socket contract (yadorilink-ipc-proto), never
by linking the daemon library, and the coordination plane only through the
credential client (yadorilink-fapi-client). Its product types wrap the pure
view derivations in yadorilink-product-view rather than re-deriving them. The
daemon stays a dev-dependency for daemon-backed tests, which this normal-only
list does not count.
"""
workspace_dependencies = [
  "yadorilink-fapi-client",
  "yadorilink-fs-platform",
  "yadorilink-ipc-proto",
  "yadorilink-local-storage",
  "yadorilink-product-view",
  "yadorilink-reporting",
  "yadorilink-transport",
]

[crate."yadorilink-client-ffi"]
reason = """
The UniFFI binding of the client layer for the native apps (Swift on macOS,
C# on Windows). It forwards to yadorilink-client-core and owns only the async
runtime the calls run on, so the apps reach the daemon and the coordination
plane exactly the way every other front end does.
"""
workspace_dependencies = ["yadorilink-client-core"]

[crate."yadorilink-mobile-ffi"]
reason = """
The UniFFI binding of the embedded host for the iOS app and its File Provider
extension. It forwards to yadorilink-embedded-host (lifecycle, typed commands,
the provider channel) and encodes the channel's messages with the shell IPC
schema (yadorilink-ipc-proto); it never links the daemon or the desktop client
layer, so the iOS library carries exactly the embedded engine.
"""
workspace_dependencies = ["yadorilink-embedded-host", "yadorilink-ipc-proto", "yadorilink-os-keychain"]

[crate."yadorilink-cli"]
reason = """
The CLI reaches the daemon only through the control-socket contract
(yadorilink-ipc-proto) and the client layer's control-socket client
(yadorilink-client-core), never by linking the daemon library; local files it
shares with the daemon (reporting consent, error candidates, the metrics
toggle) come from yadorilink-reporting. The one database it opens is the stopped
daemon's link registry, read-only, through yadorilink-sqlite-runtime's reader
(`uninstall` must prove no linked folder lies in what it deletes; it never opens
the sync engine). The daemon stays a dev-dependency for the daemon-backed
integration tests, which this normal-only list does not count.
"""
workspace_dependencies = [
  "yadorilink-client-core",
  "yadorilink-fapi-client",
  "yadorilink-fs-platform",
  "yadorilink-ipc-proto",
  "yadorilink-local-storage",
  "yadorilink-replica-domain",
  "yadorilink-reporting",
  "yadorilink-root-authority",
  "yadorilink-sqlite-runtime",
]

[crate."yadorilink-product-view"]
reason = """
Product-facing view models derived from the IPC status contract and from
coordination-plane member lists the caller fetches. Pure: it must not reach
the transport, the session, the substrate, the daemon, or another interface
crate (no yadorilink-cli: the member-list fetch belongs to the caller's
coordination-plane client).
"""
workspace_dependencies = ["yadorilink-ipc-proto"]


# ---------------------------------------------------------------------------
# Forbidden dependencies.
#
# `kinds` selects which Cargo dependency kinds the rule covers. A crate that
# must stay pure in its own right is checked across every kind; a crate that
# is only required to keep something out of its PRODUCTION graph (and whose
# own tests legitimately use it) is checked on normal and build kinds only.
#
# `packages` names third-party crates and workspace crates alike -- the
# checker matches by package name either way. The three crates whose
# `workspace_dependencies` allowlist above is empty or near-empty name their
# forbidden workspace crates HERE as well, and not only there, because that
# allowlist deliberately reads normal-kind edges only. Without these entries
# a dev- or build-kind back edge into a "pure" crate would pass unnoticed,
# which is exactly what `domain_stays_pure`'s own reason forbids.
# ---------------------------------------------------------------------------

[[forbidden_dependency]]
name = "windows_provider_policy_has_no_win32"
crates = ["yadorilink-windows-provider-policy"]
kinds = ["normal", "build", "dev"]
packages = ["windows", "windows-sys", "windows-core"]
reason = """
The policy is the part of the Windows host that runs and is tested on every
platform. A Win32 binding in its graph would make it Windows-only again; the
operating-system calls stay in windows behind its traits.
"""

[[forbidden_dependency]]
name = "domain_stays_pure"
crates = ["yadorilink-replica-domain"]
kinds = ["normal", "build", "dev"]
packages = [
  "tokio", "async-trait",
  "rusqlite", "r2d2", "r2d2_sqlite",
  "prost",
  "notify", "fs2", "walkdir", "fastcdc",
  # Workspace crates, named here and not left to the
  # `workspace_dependencies = []` allowlist above, because that allowlist
  # covers normal-kind edges only -- see the note above it. The domain model
  # holds to zero workspace dependencies of ANY kind, so the crates it must
  # never reach for are listed where `kinds` covers dev and build too.
  "yadorilink-ipc-proto", "yadorilink-local-storage", "yadorilink-transport",
]
reason = """
No async runtime, no database, no wire framing, no filesystem machinery
beneath the domain model -- not even in its own tests, which must be
runnable as plain synchronous unit tests.
"""

[[forbidden_dependency]]
name = "policy_engine_stays_pure"
crates = ["yadorilink-replica-engine"]
kinds = ["normal", "build", "dev"]
packages = [
  "tokio", "async-trait",
  "rusqlite", "r2d2", "r2d2_sqlite",
  "prost",
  "notify", "fs2", "walkdir", "fastcdc",
  "tracing",
  # Zero workspace dependencies of any kind beyond the one the allowlist
  # above admits, its own tests included -- same reasoning as
  # `domain_stays_pure`.
  "yadorilink-ipc-proto", "yadorilink-local-storage", "yadorilink-transport",
  "yadorilink-sync-wire",
]
reason = """
The policy engine is deterministic and observable through its return values.
`tracing` is forbidden alongside the runtime and storage crates on purpose:
a policy decision must be a value the caller can assert on, not a log line.
"""

[[forbidden_dependency]]
name = "wire_codec_stays_standalone"
crates = ["yadorilink-sync-wire"]
kinds = ["normal", "build", "dev"]
packages = [
  "tokio", "async-trait",
  "rusqlite", "r2d2", "r2d2_sqlite",
  "notify", "fs2", "walkdir", "fastcdc",
  # A dev-kind edge onto the domain model would recreate exactly the cycle
  # this split was made to cut, so the workspace crates are named here, where
  # `kinds` covers dev, and not only in the normal-kind allowlist above.
  "yadorilink-local-storage", "yadorilink-transport", "yadorilink-replica-domain",
]
reason = "Framing and codec only: no runtime, no storage, no filesystem."

[[forbidden_dependency]]
name = "peer_session_owns_no_storage"
crates = ["yadorilink-peer-session"]
kinds = ["normal", "build"]
packages = ["rusqlite", "r2d2", "r2d2_sqlite", "notify", "walkdir"]
reason = """
The session reaches persistence through its port traits and never runs an OS
file watcher. Its own unit tests do drive raw SQLite fixtures, so this
covers the production graph only.
"""

[[forbidden_dependency]]
name = "local_capture_owns_no_storage"
crates = ["yadorilink-local-capture"]
kinds = ["normal", "build", "dev"]
packages = ["rusqlite", "r2d2", "r2d2_sqlite", "notify"]
reason = """
No SQL of its own -- all persistence goes through the mutation-store port --
and no OS file watcher: filesystem events arrive as already-built value
types.
"""

[[forbidden_dependency]]
name = "client_core_has_no_front_end"
crates = ["yadorilink-client-core"]
kinds = ["normal", "build"]
packages = [
  "yadorilink-cli", "yadorilink-daemon",
  "eframe", "egui", "winit", "tao", "tray-icon", "rfd", "opener", "clap", "qrcode",
]
reason = """
The client layer sits beneath every front end. A front end (or a GUI toolkit,
an argument parser, a terminal QR renderer) in its production graph would make
the shared layer depend on one presentation of it, and linking the daemon
library would bypass the control-socket contract. The daemon stays usable as a
dev-dependency for daemon-backed tests.
"""


# ---------------------------------------------------------------------------
# Forbidden source symbols.
# ---------------------------------------------------------------------------

[[forbidden_symbol]]
name = "domain_source_purity"
paths = ["crates/yadorilink-replica-domain/src/**/*.rs"]
symbols = [
  "tokio::", "async_trait::",
  "rusqlite::", "r2d2::", "r2d2_sqlite::",
  "prost::", "yadorilink_ipc_proto::",
  "yadorilink_local_storage::", "yadorilink_transport::",
  "notify::", "fs2::", "walkdir::", "fastcdc::",
  "std::fs", "std::net",
]
reason = "The domain model touches neither the filesystem nor the network."

[[forbidden_symbol]]
name = "control_socket_client_is_single"
paths = [
  "crates/yadorilink-client-ffi/src/**/*.rs",
  "crates/yadorilink-cli/src/**/*.rs",
]
symbols = [
  "framing::write_message",
  "framing::read_message",
  "control_socket_path(",
  "control_pipe_name(",
]
reason = """
The daemon's control socket has one client, in the client layer. A second copy
of the framing, the connect logic or the protocol-version check in a front end
is how two front ends came to disagree about where the socket is and how a
protocol mismatch reads.
"""

[[forbidden_symbol]]
name = "client_core_has_no_terminal_io"
paths = ["crates/yadorilink-client-core/src/**/*.rs"]
test_spans = "exclude"
symbols = [
  "println!", "eprintln!", "print!(", "eprint!(",
  "std::io::stdin", "std::io::stdout", "std::io::stderr",
  "std::process::exit", "IsTerminal",
]
reason = """
The client layer returns typed results and errors; it never writes to a
terminal, reads one, or ends the process. Presenting a result is the front
end's job, and a GUI has no terminal to write to.
"""

[[forbidden_symbol]]
name = "policy_engine_source_purity"
paths = ["crates/yadorilink-replica-engine/src/**/*.rs"]
symbols = [
  "tokio::", "async_trait::",
  "rusqlite::", "r2d2::", "r2d2_sqlite::",
  "prost::", "yadorilink_ipc_proto::",
  "yadorilink_local_storage::", "yadorilink_transport::",
  "yadorilink_sync_wire::",
  "notify::", "fs2::", "walkdir::", "fastcdc::",
  "tracing::",
  "std::fs", "std::net",
  "SessionTransports",
]
reason = """
The policy engine must stay callable from a plain synchronous test. The
session's transport port is listed too: a reverse dependency on the session
or protocol layer would put the engine back inside the thing it was extracted
out of.
"""

[[forbidden_symbol]]
name = "wire_codec_source_isolation"
paths = ["crates/yadorilink-sync-wire/src/**/*.rs"]
symbols = [
  "tokio::", "async_trait::",
  "rusqlite::", "r2d2::", "r2d2_sqlite::",
  "yadorilink_local_storage::", "yadorilink_transport::",
  "yadorilink_replica_domain::",
  "notify::", "fs2::", "walkdir::", "fastcdc::",
  "std::fs", "std::net",
]
reason = """
The codec turns bytes into frames and back. It neither performs the I/O that
carries those bytes nor interprets them as domain values.
"""

[[forbidden_symbol]]
name = "track_send_rides_the_iroh_endpoint_only"
paths = [
  "crates/yadorilink-send/src/**/*.rs",
  "crates/yadorilink-daemon/src/send_transfer.rs",
]
symbols = [
  "QuicPeerEndpoint", "quic_peer_endpoint", "TransportHub", "quinn::",
  "shared_quic_peer_endpoint", "connect_send", "take_inbound_send",
  "PeerSyncSession", "SessionTransports", "open_lane", "accept_lane",
]
reason = """
Track Send is its own protocol on the device's one iroh endpoint: ALPN
`yadorilink/send/v1`, with its own admission (a live grant, or an accepted
offer the receiver may pull while the netmap still pins it). It is never
