[package]
name = "yadorilink-lane-ports"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# A real substrate endpoint for tests below the daemon that have to build a
# session with real transports. See `testing`'s own module doc.
test-support = [
    "dep:iroh",
    # Only `sim_fault` needs these, and only to name the types iroh's
    # custom-transport traits are written in: a `CustomAddr`, a watcher, a
    # `RecvMeta`. iroh does not re-export them, and all three are already in
    # the lockfile as its own dependencies, so this adds edges and no
    # versions.
    "dep:iroh-base",
    "dep:n0-watcher",
    "dep:noq-udp",
    "yadorilink-sync-substrate/test-support",
]

[dependencies]
yadorilink-peer-session = { path = "../yadorilink-peer-session" }
yadorilink-sync-protocol = { path = "../yadorilink-sync-protocol" }
yadorilink-sync-runtime = { path = "../yadorilink-sync-runtime" }
yadorilink-sync-substrate = { path = "../yadorilink-sync-substrate" }
yadorilink-transport = { path = "../yadorilink-transport" }
async-trait = "0.1"
iroh = { version = "1.1", optional = true }
iroh-base = { version = "1.1", optional = true }
n0-watcher = { version = "1.0", optional = true }
noq-udp = { version = "1.2", optional = true }
hex = "0.4"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `testing::SharedAddressBook` stands in for the coordination plane. Nodes are
# dialled by endpoint id now, so a test needs somewhere for them to publish and
# resolve addresses -- see `yadorilink_sync_substrate::directory`.
yadorilink-sync-substrate = { path = "../yadorilink-sync-substrate", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
yadorilink-replica-domain = { path = "../yadorilink-replica-domain" }
